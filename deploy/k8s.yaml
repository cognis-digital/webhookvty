apiVersion: apps/v1
kind: Deployment
metadata: { name: webhookvty, labels: { app: webhookvty } }
spec:
  replicas: 1
  selector: { matchLabels: { app: webhookvty } }
  template:
    metadata: { labels: { app: webhookvty } }
    spec:
      containers:
        - name: webhookvty
          image: ghcr.io/cognis-digital/webhookvty:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: webhookvty }
spec:
  selector: { app: webhookvty }
  ports: [{ port: 80, targetPort: 8000 }]
